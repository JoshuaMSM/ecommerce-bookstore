<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> Bookstore Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <img src="/logo.svg" alt="Store logo" style="height:28px;vertical-align:middle;margin-right:10px"> Bookstore Demo
    </div>
    <div class="nav-right">
      <a href="/index.html">Items</a>
      <a href="/orders.html">Orders</a>
      <a id="auth-link" href="/login.html">Login</a>
    </div>
  </nav>

  <main class="container">
    <h1>Sign in / Register</h1>
    <div class="auth-grid">
      <div class="auth-card">
        <h3>Sign in</h3>
        <input id="si-user" placeholder="username">
        <input id="si-pass" placeholder="password" type="password">
        <button id="signin" class="btn">Sign in</button>
      </div>
      <div class="auth-card">
        <h3>Register</h3>
        <input id="r-user" placeholder="username">
        <input id="r-pass" placeholder="password" type="password">
        <button id="register" class="btn">Register</button>
      </div>
    </div>
  </main>

  <script>
    async function postJson(url, body){
      const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      return res;
    }

    document.getElementById('signin').addEventListener('click', async ()=>{
      const username = document.getElementById('si-user').value;
      const password = document.getElementById('si-pass').value;
      const res = await postJson('/signin', {username,password});
      if (!res.ok) {
        const body = await res.json().catch(()=>null);
        return alert(body && body.error ? body.error : 'Sign in failed');
      }
      window.location = '/';
    });

    document.getElementById('register').addEventListener('click', async ()=>{
      const username = document.getElementById('r-user').value;
      const password = document.getElementById('r-pass').value;
      const res = await postJson('/register', {username,password});
      if (!res.ok) {
        const txt = await res.json().catch(()=>null); alert(txt && txt.error ? txt.error : 'Register failed'); return;
      }
      window.location = '/';
    });
    // update auth link state
    (async function updateAuthLink(){
      try{
        const res = await fetch('/me');
        const js = await res.json();
        const a = document.getElementById('auth-link');
        if (js && js.user) { a.textContent = `Logout (${js.user.username})`; a.href = '/signout'; }
        else { a.textContent = 'Login'; a.href = '/login.html'; }
      }catch(e){/*ignore*/}
    })();
  </script>
</body>
</html>
