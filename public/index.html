<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bookstore Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <img src="/logo.svg" alt="Store logo" style="height:28px;vertical-align:middle;margin-right:10px"> Bookstore Demo
    </div>
    <div class="nav-right">
      <a href="/index.html">Items</a>
      <a href="/orders.html">Orders</a>
    </div>
  </nav>

  <main class="container">
    <h1>Items</h1>
    <p class="store-tagline">Curated books to sharpen your craft. Fast shipping, friendly returns.</p>
    <div id="books" class="grid"></div>
  </main>

  <script>
    async function loadBooks(){
      const res = await fetch('/books');
      const books = await res.json();
      const container = document.getElementById('books');
      container.innerHTML = '';
      books.forEach(b => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="book-meta">
            <div class="book-title">${escapeHtml(b.title)}</div>
            <div class="book-price">$${b.price.toFixed(2)}</div>
          </div>
          <div class="book-desc">${escapeHtml(b.description || '')}</div>
          <div class="book-actions">
            <button data-id="${b.id}" class="buy">Buy 1</button>
          </div>`;
        container.appendChild(card);
      });
      container.querySelectorAll('button.buy').forEach(btn => btn.addEventListener('click', buy));
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function buy(e){
      const id = Number(e.target.dataset.id);
      const res = await fetch('/orders', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items:[{id,qty:1}]})});
      if (!res.ok) return alert('Order failed');
      const body = await res.json();
      alert('Order placed. Total: $' + body.total.toFixed(2) + '\nOrderId: ' + body.orderId);
    }

    loadBooks();
  </script>
</body>
</html>
